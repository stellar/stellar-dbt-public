version: 2

models:
  - name: dummy_snapshot_full_refresh
    description: "placeholder"
    config:
      materialized: "incremental_snapshot"
      enabled: '{{ target.name == "ci" }}'
      unique_key: ["account_id", "valid_from"]
      source_name: "stg_dummy"
      temp_source_table: "dummy_snapshot_source"
      temp_target_table: "dummy_snapshot_target"
      expected_target_table_name: "{{target.database}}.{{target.schema}}_snapshots.dummy_snapshot_expected"
      snapshot_start_date: "2025-01-01"
      snapshot_end_date: "2025-01-03"
      full_refresh: true
      updated_at_col_name: "closed_at"
      valid_from_col_name: "valid_from"
      valid_to_col_name: "valid_until"
      source_unique_key: "account_id"
      source_data_sql: |
        select
          row.test_case_description,
          row.account_id,
          row.balance,
          row.closed_at
        from unnest([
          struct('record to be ignored as it is out of backfill date range' as test_case_description, '1' as account_id, 100 as balance, timestamp('2024-01-01 00:00:00 UTC') as closed_at),
          struct('record to be ignore as it is updated later in same day' as test_case_description, '1' as account_id, 100 as balance, timestamp('2025-01-01 00:00:00 UTC') as closed_at),
          struct('record to be inserted' as test_case_description, '1' as account_id, 150 as balance, timestamp('2025-01-01 01:00:00 UTC') as closed_at),
          struct('record to be inserted, as new version of existing source record' as test_case_description, '1' as account_id, 200 as balance, timestamp('2025-01-02 00:00:00 UTC') as closed_at),
          struct('record to be inserted as is, since target will be dropped for full refresh' as test_case_description, '2' as account_id, 500 as balance, timestamp('2025-01-02 00:00:00 UTC') as closed_at),
          struct('record to be inserted as is, since target will be dropped for full refresh' as test_case_description, '3' as account_id, 100 as balance, timestamp('2025-01-01 00:00:00 UTC') as closed_at)
        ]) as row
      target_data_sql: |
        select
          row.test_case_description,
          row.account_id,
          row.balance,
          row.closed_at,
          row.valid_from,
          row.valid_until
        from unnest([
          struct('record will be dropped for full refresh' as test_case_description, '2' as account_id, 100 as balance, timestamp('2025-01-01 00:00:00 UTC') as closed_at, timestamp('2025-01-01 00:00:00 UTC') as valid_from, timestamp(null) as valid_until),
          struct('record will be dropped for full refresh' as test_case_description, '3' as account_id, 50 as balance, timestamp('2025-01-02 00:00:00 UTC') as closed_at, timestamp('2025-01-02 00:00:00 UTC') as valid_from, timestamp(null) as valid_until)
        ]) as row
      expected_target_data_sql: |
        select
          row.test_case_description,
          row.account_id,
          row.balance,
          row.closed_at,
          row.valid_from,
          row.valid_until
        from unnest([
          struct('record to be inserted' as test_case_description, '1' as account_id, 150 as balance, timestamp('2025-01-01 01:00:00 UTC') as closed_at, timestamp('2025-01-01 01:00:00 UTC') as valid_from, timestamp('2025-01-02 00:00:00 UTC') as valid_until),
          struct('record to be inserted, as new version of existing source record' as test_case_description, '1' as account_id, 200 as balance, timestamp('2025-01-02 00:00:00 UTC') as closed_at, timestamp('2025-01-02 00:00:00 UTC') as valid_from, timestamp(null) as valid_until),
          struct('record to be inserted as is, since target will be dropped for full refresh' as test_case_description, '2' as account_id, 500 as balance, timestamp('2025-01-02 00:00:00 UTC') as closed_at, timestamp('2025-01-02 00:00:00 UTC') as valid_from, timestamp(null) as valid_until),
          struct('record to be inserted as is, since target will be dropped for full refresh' as test_case_description, '3' as account_id, 100 as balance, timestamp('2025-01-01 00:00:00 UTC') as closed_at, timestamp('2025-01-01 00:00:00 UTC') as valid_from, timestamp(null) as valid_until)
        ]) as row

    tests:
      - dbt_utils.equality:
          compare_model: "{{target.database}}.{{target.schema}}_snapshots.dummy_snapshot_expected"

  - name: dummy_snapshot_incremental
    description: "placeholder"
    config:
      materialized: "incremental_snapshot"
      enabled: '{{ target.name == "ci" }}'
      unique_key: ["account_id", "valid_from"]
      source_name: "stg_dummy"
      temp_source_table: "dummy_snapshot_source"
      temp_target_table: "dummy_snapshot_target"
      expected_target_table_name: "{{target.database}}.{{target.schema}}_snapshots.dummy_snapshot_expected"
      snapshot_start_date: "2025-01-01"
      snapshot_end_date: "2025-01-03"
      full_refresh: false
      updated_at_col_name: "closed_at"
      valid_from_col_name: "valid_from"
      valid_to_col_name: "valid_until"
      source_unique_key: "account_id"
      source_data_sql: |
        select
          row.test_case_description,
          row.account_id,
          row.balance,
          row.closed_at
        from unnest([
          struct('record to be ignored as it is out of backfill date range' as test_case_description, '1' as account_id, 100 as balance, timestamp('2024-01-01 00:00:00 UTC') as closed_at),
          struct('record to be ignore as it is updated later in same day' as test_case_description, '1' as account_id, 100 as balance, timestamp('2025-01-01 00:00:00 UTC') as closed_at),
          struct('record to be inserted' as test_case_description, '1' as account_id, 150 as balance, timestamp('2025-01-01 01:00:00 UTC') as closed_at),
          struct('record to be inserted, as new version of existing source record' as test_case_description, '1' as account_id, 200 as balance, timestamp('2025-01-02 00:00:00 UTC') as closed_at),
          struct('record to be inserted as new version of existing record' as test_case_description, '2' as account_id, 500 as balance, timestamp('2025-01-02 00:00:00 UTC') as closed_at),
          struct('record to be inserted as an earlier version, since target holds a newer one' as test_case_description, '3' as account_id, 100 as balance, timestamp('2025-01-01 00:00:00 UTC') as closed_at)
        ]) as row
      target_data_sql: |
        select
          row.test_case_description,
          row.account_id,
          row.balance,
          row.closed_at,
          row.valid_from,
          row.valid_until
        from unnest([
          struct('records valid_until will bet set' as test_case_description, '2' as account_id, 100 as balance, timestamp('2025-01-01 00:00:00 UTC') as closed_at, timestamp('2025-01-01 00:00:00 UTC') as valid_from, timestamp(null) as valid_until),
          struct('record will remain as is' as test_case_description, '3' as account_id, 50 as balance, timestamp('2025-01-02 00:00:00 UTC') as closed_at, timestamp('2025-01-02 00:00:00 UTC') as valid_from, timestamp(null) as valid_until)
        ]) as row
      expected_target_data_sql: |
        select
          row.test_case_description,
          row.account_id,
          row.balance,
          row.closed_at,
          row.valid_from,
          row.valid_until
        from unnest([
          struct('record to be inserted' as test_case_description, '1' as account_id, 150 as balance, timestamp('2025-01-01 01:00:00 UTC') as closed_at, timestamp('2025-01-01 01:00:00 UTC') as valid_from, timestamp('2025-01-02 00:00:00 UTC') as valid_until),
          struct('record to be inserted, as new version of existing source record' as test_case_description, '1' as account_id, 200 as balance, timestamp('2025-01-02 00:00:00 UTC') as closed_at, timestamp('2025-01-02 00:00:00 UTC') as valid_from, timestamp(null) as valid_until),
          struct('records valid_until will bet set' as test_case_description, '2' as account_id, 100 as balance, timestamp('2025-01-01 00:00:00 UTC') as closed_at, timestamp('2025-01-01 00:00:00 UTC') as valid_from, timestamp('2025-01-02 00:00:00 UTC') as valid_until),
          struct('record to be inserted as new version of existing record' as test_case_description, '2' as account_id, 500 as balance, timestamp('2025-01-02 00:00:00 UTC') as closed_at, timestamp('2025-01-02 00:00:00 UTC') as valid_from, timestamp(null) as valid_until),
          struct('record to be inserted as an earlier version, since target holds a newer one' as test_case_description, '3' as account_id, 100 as balance, timestamp('2025-01-01 00:00:00 UTC') as closed_at, timestamp('2025-01-01 00:00:00 UTC') as valid_from, timestamp('2025-01-02 00:00:00 UTC') as valid_until),
          struct('record will remain as is' as test_case_description, '3' as account_id, 50 as balance, timestamp('2025-01-02 00:00:00 UTC') as closed_at, timestamp('2025-01-02 00:00:00 UTC') as valid_from, timestamp(null) as valid_until)
        ]) as row

    tests:
      - dbt_utils.equality:
          compare_model: "{{target.database}}.{{target.schema}}_snapshots.dummy_snapshot_expected"

  # Re-running a range the snapshot already covers must leave the target untouched.
  # The day-by-day implementation seeded from valid_to IS NULL, so a re-run either did
  # nothing or duplicated versions depending on where the range sat relative to the head.
  - name: dummy_snapshot_rerun
    description: "placeholder"
    config:
      materialized: "incremental_snapshot"
      enabled: '{{ target.name == "ci" }}'
      unique_key: ["account_id", "valid_from"]
      source_name: "stg_dummy"
      temp_source_table: "dummy_snapshot_rerun_source"
      temp_target_table: "dummy_snapshot_rerun_target"
      expected_target_table_name: "{{target.database}}.{{target.schema}}_snapshots.dummy_snapshot_rerun_expected"
      snapshot_start_date: "2025-01-01"
      snapshot_end_date: "2025-01-03"
      full_refresh: false
      updated_at_col_name: "closed_at"
      valid_from_col_name: "valid_from"
      valid_to_col_name: "valid_until"
      source_unique_key: "account_id"
      source_data_sql: |
        select
          row.test_case_description,
          row.account_id,
          row.balance,
          row.closed_at
        from unnest([
          struct('source version the target already holds' as test_case_description, '1' as account_id, 150 as balance, timestamp('2025-01-01 01:00:00 UTC') as closed_at),
          struct('source version the target already holds' as test_case_description, '1' as account_id, 200 as balance, timestamp('2025-01-02 00:00:00 UTC') as closed_at)
        ]) as row
      target_data_sql: |
        select
          row.test_case_description,
          row.account_id,
          row.balance,
          row.closed_at,
          row.valid_from,
          row.valid_until
        from unnest([
          struct('source version the target already holds' as test_case_description, '1' as account_id, 150 as balance, timestamp('2025-01-01 01:00:00 UTC') as closed_at, timestamp('2025-01-01 01:00:00 UTC') as valid_from, timestamp('2025-01-02 00:00:00 UTC') as valid_until),
          struct('source version the target already holds' as test_case_description, '1' as account_id, 200 as balance, timestamp('2025-01-02 00:00:00 UTC') as closed_at, timestamp('2025-01-02 00:00:00 UTC') as valid_from, timestamp(null) as valid_until)
        ]) as row
      expected_target_data_sql: |
        select
          row.test_case_description,
          row.account_id,
          row.balance,
          row.closed_at,
          row.valid_from,
          row.valid_until
        from unnest([
          struct('source version the target already holds' as test_case_description, '1' as account_id, 150 as balance, timestamp('2025-01-01 01:00:00 UTC') as closed_at, timestamp('2025-01-01 01:00:00 UTC') as valid_from, timestamp('2025-01-02 00:00:00 UTC') as valid_until),
          struct('source version the target already holds' as test_case_description, '1' as account_id, 200 as balance, timestamp('2025-01-02 00:00:00 UTC') as closed_at, timestamp('2025-01-02 00:00:00 UTC') as valid_from, timestamp(null) as valid_until)
        ]) as row

    tests:
      - dbt_utils.equality:
          compare_model: "{{target.database}}.{{target.schema}}_snapshots.dummy_snapshot_rerun_expected"

  # A composite source_unique_key whose columns contain nulls, as trustlines_snapshot has:
  # a trustline carries liquidity_pool_id or asset_code/asset_issuer, never both. Matching
  # such keys with = fails on the null column, which would insert a second open version
  # instead of closing the existing one.
  - name: dummy_snapshot_null_unique_key
    description: "placeholder"
    config:
      materialized: "incremental_snapshot"
      enabled: '{{ target.name == "ci" }}'
      unique_key: ["account_id", "pool_id", "valid_from"]
      source_name: "stg_dummy"
      temp_source_table: "dummy_snapshot_null_key_source"
      temp_target_table: "dummy_snapshot_null_key_target"
      expected_target_table_name: "{{target.database}}.{{target.schema}}_snapshots.dummy_snapshot_null_key_expected"
      snapshot_start_date: "2025-01-01"
      snapshot_end_date: "2025-01-03"
      full_refresh: false
      updated_at_col_name: "closed_at"
      valid_from_col_name: "valid_from"
      valid_to_col_name: "valid_until"
      source_unique_key: ["account_id", "pool_id"]
      source_data_sql: |
        select
          row.test_case_description,
          row.account_id,
          row.pool_id,
          row.balance,
          row.closed_at
        from unnest([
          struct('new version of an entity whose pool_id is null' as test_case_description, '1' as account_id, cast(null as string) as pool_id, 150 as balance, timestamp('2025-01-02 00:00:00 UTC') as closed_at),
          struct('new version of an entity whose pool_id is set' as test_case_description, '2' as account_id, 'P1' as pool_id, 300 as balance, timestamp('2025-01-02 00:00:00 UTC') as closed_at)
        ]) as row
      target_data_sql: |
        select
          row.test_case_description,
          row.account_id,
          row.pool_id,
          row.balance,
          row.closed_at,
          row.valid_from,
          row.valid_until
        from unnest([
          struct('version to be closed, pool_id is null' as test_case_description, '1' as account_id, cast(null as string) as pool_id, 100 as balance, timestamp('2025-01-01 00:00:00 UTC') as closed_at, timestamp('2025-01-01 00:00:00 UTC') as valid_from, timestamp(null) as valid_until),
          struct('version to be closed, pool_id is set' as test_case_description, '2' as account_id, 'P1' as pool_id, 250 as balance, timestamp('2025-01-01 00:00:00 UTC') as closed_at, timestamp('2025-01-01 00:00:00 UTC') as valid_from, timestamp(null) as valid_until)
        ]) as row
      expected_target_data_sql: |
        select
          row.test_case_description,
          row.account_id,
          row.pool_id,
          row.balance,
          row.closed_at,
          row.valid_from,
          row.valid_until
        from unnest([
          struct('version to be closed, pool_id is null' as test_case_description, '1' as account_id, cast(null as string) as pool_id, 100 as balance, timestamp('2025-01-01 00:00:00 UTC') as closed_at, timestamp('2025-01-01 00:00:00 UTC') as valid_from, timestamp('2025-01-02 00:00:00 UTC') as valid_until),
          struct('new version of an entity whose pool_id is null' as test_case_description, '1' as account_id, cast(null as string) as pool_id, 150 as balance, timestamp('2025-01-02 00:00:00 UTC') as closed_at, timestamp('2025-01-02 00:00:00 UTC') as valid_from, timestamp(null) as valid_until),
          struct('version to be closed, pool_id is set' as test_case_description, '2' as account_id, 'P1' as pool_id, 250 as balance, timestamp('2025-01-01 00:00:00 UTC') as closed_at, timestamp('2025-01-01 00:00:00 UTC') as valid_from, timestamp('2025-01-02 00:00:00 UTC') as valid_until),
          struct('new version of an entity whose pool_id is set' as test_case_description, '2' as account_id, 'P1' as pool_id, 300 as balance, timestamp('2025-01-02 00:00:00 UTC') as closed_at, timestamp('2025-01-02 00:00:00 UTC') as valid_from, timestamp(null) as valid_until)
        ]) as row

    tests:
      - dbt_utils.equality:
          compare_model: "{{target.database}}.{{target.schema}}_snapshots.dummy_snapshot_null_key_expected"
