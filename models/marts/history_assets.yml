version: 2

models:
  - name: history_assets
    description: '{{ doc("history_assets") }}'
    tests:
      - recency:
          tags: [recency]
          datepart: day
          field: cast(batch_run_date as timestamp)
          interval: 2
          timestamp_val: '{{ var("batch_end_date") }}'
          config:
            enabled: '{{ target.name == "ci" or var("is_recency_airflow_task") == "true" }}'
            severity: '{{ "error" if target.name == "prod" else "warn" }}'
          meta:
            description: "Monitors the freshness of your table over time, as the expected time between data updates."
      - dbt_utils.unique_combination_of_columns:
          combination_of_columns:
            - asset_type
            - asset_code
            - asset_issuer
    columns:
      - name: asset_id
        description: '{{ doc("assets_id") }}'
        tests:
          - unique
          - not_null

      - name: asset_type
        description: '{{ doc("asset_type") }}'
        tests:
          - not_null
          - accepted_values:
              values: ["credit_alphanum12", "credit_alphanum4", "native"]

      - name: asset_code
        description: '{{ doc("asset_code") }}'
        tests:
          - not_null:
              config:
                where: 'asset_type != "native"'

      - name: asset_issuer
        description: '{{ doc("asset_issuer") }}'
        tests:
          - not_null:
              config:
                where: 'asset_type != "native"'

      - name: batch_id
        description: '{{ doc("batch_id") }}'
        tests:
          - not_null

      - name: batch_run_date
        description: '{{ doc("batch_run_date") }}'
        tests:
          - not_null
