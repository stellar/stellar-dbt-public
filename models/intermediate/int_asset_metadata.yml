version: 2

models:
  - name: int_asset_metadata
    description: '{{ doc("int_asset_metadata") }}'
    columns:
      - name: contract_id
        description: '{{ doc("contract_id") }}'
        tests:
          - not_null
          - unique

      - name: asset_code
        description: '{{ doc("asset_code") }}'

      - name: asset_issuer
        description: '{{ doc("asset_issuer") }}'

      - name: asset_type
        description: '{{ doc("asset_type") }}'

      - name: symbol
        description: '{{ doc("contract_symbol") }}'

      - name: name
        description: '{{ doc("contract_name") }}'

      - name: decimal
        description: '{{ doc("decimal_precision") }}'

      - name: admin
        description: '{{ doc("contract_admin") }}'

      - name: asset_code_source
        description: '{{ doc("int_asset_metadata__asset_code_source") }}'
        tests:
          - accepted_values:
              values: ["sac", "seed", "metadata"]
