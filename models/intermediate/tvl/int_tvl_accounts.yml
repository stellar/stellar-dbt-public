version: 2

models:
  - name: int_tvl_accounts
    description: '{{ doc("int_tvl_accounts") }}'
    tests:
      - stellar_dbt_public.incremental_unique_combination_of_columns:
          arguments:
            combination_of_columns:
              - day
              - account_id
            date_column_name: "day"
            greater_than_equal_to: "2 day"
          config:
            meta:
              description: "Tests the uniqueness combination of: day, account_id."
    columns:
      - name: day
        description: '{{ doc("day") }}'
        tests:
          - stellar_dbt_public.incremental_not_null:
              arguments:
                date_column_name: "day"
                greater_than_equal_to: "2 day"

      - name: account_id
        description: '{{ doc("account_id") }}'
        tests:
          - stellar_dbt_public.incremental_not_null:
              arguments:
                date_column_name: "day"
                greater_than_equal_to: "2 day"

      - name: accounts_tvl
        description: '{{ doc("accounts_tvl") }}'
        tests:
          - stellar_dbt_public.incremental_not_null:
              arguments:
                date_column_name: "day"
                greater_than_equal_to: "2 day"
