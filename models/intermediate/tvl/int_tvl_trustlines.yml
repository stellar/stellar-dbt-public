version: 2

models:
  - name: int_tvl_trustlines
    description: '{{ doc("int_tvl_trustlines") }}'
    tests:
      - stellar_dbt_public.incremental_unique_combination_of_columns:
          combination_of_columns:
            - day
            - account_id
            - asset_code
            - asset_issuer
            - asset_type
          date_column_name: "day"
          greater_than_equal_to: "2 day"
          meta:
            description: "Tests the uniqueness combination of: day, account_id, asset_code, asset_issuer, asset_type."
    columns:
      - name: day
        description: '{{ doc("day") }}'
        tests:
          - stellar_dbt_public.incremental_not_null:
              date_column_name: "day"
              greater_than_equal_to: "2 day"

      - name: account_id
        description: '{{ doc("int_tvl_trustlines__account_id") }}'
        tests:
          - stellar_dbt_public.incremental_not_null:
              date_column_name: "day"
              greater_than_equal_to: "2 day"

      - name: asset_type
        description: '{{ doc("asset_type") }}'
        tests:
          - stellar_dbt_public.incremental_not_null:
              date_column_name: "day"
              greater_than_equal_to: "2 day"

      - name: asset_code
        description: '{{ doc("int_tvl_trustlines__asset_code") }}'
        tests:
          - stellar_dbt_public.incremental_not_null:
              date_column_name: "day"
              greater_than_equal_to: "2 day"

      - name: asset_issuer
        description: '{{ doc("int_tvl_trustlines__asset_issuer") }}'
        tests:
          - stellar_dbt_public.incremental_not_null:
              date_column_name: "day"
              greater_than_equal_to: "2 day"

      - name: trustlines_tvl
        description: '{{ doc("trustlines_tvl") }}'
        tests:
          - stellar_dbt_public.incremental_not_null:
              date_column_name: "day"
              greater_than_equal_to: "2 day"
