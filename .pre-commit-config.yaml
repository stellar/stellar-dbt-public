repos:
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v4.5.0
    hooks:
      - id: check-added-large-files # prevents giant files from being committed.
      - id: check-case-conflict # checks for files that would conflict in case-insensitive filesystems.
      - id: check-merge-conflict # checks for files that contain merge conflict strings.
      - id: detect-private-key # detects the presence of private keys.
      - id: end-of-file-fixer # ensures that a file is either empty, or ends with one newline.
      - id: fix-byte-order-marker # removes utf-8 byte order marker.
      - id: mixed-line-ending # replaces or checks mixed line ending.
      - id: requirements-txt-fixer # sorts entries in requirements.txt.
      - id: trailing-whitespace # trims trailing whitespace.

  - repo: https://github.com/pre-commit/mirrors-prettier
    rev: v3.1.0
    hooks:
      - id: prettier
        files: \.(json|yaml|yml)$
        language_version: 14.21.3

  - repo: https://github.com/sqlfluff/sqlfluff
    rev: 3.5.0
    hooks:
      - id: sqlfluff-lint
        args: ["lint", "--processes", "0", "--config=./.sqlfluff"]
        additional_dependencies:
          [
            "sqlfluff-templater-dbt==3.5.0",
            "dbt-bigquery==1.10.3",
            "python-dotenv",
          ]
        entry: ./pre-commit/for_pre_commit.sh

      - id: sqlfluff-fix
        args: ["fix", "--force", "--processes", "0", "--config=./.sqlfluff"]
        additional_dependencies:
          [
            "sqlfluff-templater-dbt==3.5.0",
            "dbt-bigquery==1.10.3",
            "python-dotenv",
          ]
        entry: ./pre-commit/for_pre_commit.sh

  - repo: local
    hooks:
      - id: docs-lint
        name: Descriptions live in doc blocks, not inline in yml
        entry: python scripts/docs_lint.py check
        language: python
        additional_dependencies: ["pyyaml"]
        pass_filenames: false
        # The check reads the whole repo and takes well under a second, so it runs
        # unconditionally. A `files` filter would skip it on a commit that only
        # deletes a referenced .md, which is exactly when a dangling doc()
        # reference appears.
        always_run: true

      - id: docs-lint-tests
        name: docs_lint.py unit tests
        entry: python scripts/test_docs_lint.py
        language: python
        additional_dependencies: ["pyyaml"]
        pass_filenames: false
        # Only when the linter or its tests change; the tests take well under a
        # second but there is no reason to run them on every commit.
        files: ^scripts/(docs_lint|test_docs_lint)\.py$

      - id: cleanup
        name: Cleanup .env.tmp
        entry: ./pre-commit/cleanup.sh
        language: system
        stages: [commit]
