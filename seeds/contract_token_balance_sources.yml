version: 2

seeds:
  - name: contract_token_balance_sources
    description: >
      Custom contract tokens whose holder balances must be read from contract storage
      (`contract_data_snapshot`) instead of SEP-41 token transfer events.

      The contract-token balance pipeline assumes every token emits SEP-41 events, so a
      contract that emits none is invisible end to end: it never lands in
      `stg_assets`, `int_asset_metadata`, or `int_account_balances__contracts`, and its
      supply is therefore missing from `asset_balances__daily_agg` and from market cap.
      A contract that emits only *some* events is worse than invisible -- the cumulative
      sum in `int_account_balances__contracts` drifts and can even go negative.

      Listing a contract here switches it to storage-derived balances for its whole life.
      Storage holds balance *levels*, not deltas, so the result is correct by construction
      and self-healing: new mints, redemptions and transfers are picked up with no further
      maintenance. This is deliberately not a table of correction *amounts* -- amounts go
      stale the moment the contract mints again, and they cannot reproduce the per-holder
      distribution that `account_balances` needs.

      A contract listed here is excluded from the event-derived path entirely. There is no
      splicing between the two sources: the cumulative event sum has no opening balance to
      start from, so a half-and-half contract would be wrong on both sides of the boundary.

      Defaults target the standard soroban-token-sdk layout, where a balance entry is keyed
      `ScVec[ScSymbol("Balance"), ScAddress]` and valued `i128`. A contract using a different
      shape overrides the three parser columns rather than needing a model change.
    config:
      column_types:
        contract_id: string
        effective_from: date
        effective_to: date
        balance_key_symbol: string
        holder_key_index: int64
        amount_value_type: string
        decimals_override: int64
        reason: string
        ticket: string
    columns:
      - name: contract_id
        description: Contract address (C...) of the token whose balances come from storage.
        tests:
          - not_null
          - unique

      - name: effective_from
        description: >
          First day storage-derived balances are published for this contract, normally the
          day the contract was created. Also used as the asset's `created_at` in
          `stg_assets`, since there is no first-event timestamp to fall back on.
        tests:
          - not_null

      - name: effective_to
        description: >
          Exclusive last day of storage-derived balances; empty means open-ended. Set this
          instead of deleting the row when a contract should stop being tracked, so already
          published history survives a full refresh.

      - name: balance_key_symbol
        description: >
          Leading `ScSymbol` of the balance ledger key. Empty means `Balance`
          (the soroban-token-sdk default).

      - name: holder_key_index
        description: >
          Zero-based position of the holder address inside the key vector. Empty means `1`,
          i.e. `ScVec[ScSymbol("Balance"), ScAddress]`.

      - name: amount_value_type
        description: >
          Name of the scalar field holding the balance in the entry value. Empty means
          `i128`.
        tests:
          - accepted_values:
              values: ["i128", "u128", "i64", "u64", ""]
              config:
                where: "amount_value_type is not null"

      - name: decimals_override
        description: >
          Token decimals, when they cannot be read from contract instance storage by
          `int_asset_metadata`. Empty means use the metadata value, falling back to 7.

      - name: reason
        description: Why this contract needs storage-derived balances.
        tests:
          - not_null

      - name: ticket
        description: Issue or PR that introduced the row.
