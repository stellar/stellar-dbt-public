version: 2

seeds:
  - name: contract_token_balance_sources
    description: '{{ doc("contract_token_balance_sources") }}'
    config:
      column_types:
        contract_id: string
        effective_from: date
        events_start_from: date
        balance_key_symbol: string
        holder_key_index: int64
        amount_value_type: string
        token_symbol: string
        token_name: string
        decimals: int64
        reason: string
        ticket: string
    tests:
      # Storage has to drive for at least one day before it can hand over: the opening
      # balance is the level standing at the end of the day before events_start_from, so
      # a same-day value would publish no storage days and open the event stream from zero.
      - dbt_utils.expression_is_true:
          expression: "events_start_from is null or effective_from < events_start_from"
    columns:
      - name: contract_id
        description: '{{ doc("contract_token_balance_sources__contract_id") }}'
        tests:
          - not_null
          - unique

      - name: effective_from
        description: '{{ doc("contract_token_balance_sources__effective_from") }}'
        tests:
          - not_null

      - name: events_start_from
        description: '{{ doc("contract_token_balance_sources__events_start_from") }}'

      - name: balance_key_symbol
        description: '{{ doc("contract_token_balance_sources__balance_key_symbol") }}'

      - name: holder_key_index
        description: '{{ doc("contract_token_balance_sources__holder_key_index") }}'

      - name: amount_value_type
        description: '{{ doc("contract_token_balance_sources__amount_value_type") }}'
        tests:
          - accepted_values:
              values: ["i128", "u128", "i64", "u64", ""]
              config:
                where: "amount_value_type is not null"

      - name: token_symbol
        description: '{{ doc("contract_token_balance_sources__token_symbol") }}'

      - name: token_name
        description: '{{ doc("contract_token_balance_sources__token_name") }}'

      - name: decimals
        description: '{{ doc("contract_token_balance_sources__decimals") }}'
        tests:
          - not_null

      - name: reason
        description: '{{ doc("contract_token_balance_sources__reason") }}'
        tests:
          - not_null

      - name: ticket
        description: '{{ doc("contract_token_balance_sources__ticket") }}'
