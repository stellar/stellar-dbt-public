version: 2

macros:
  - name: snapshot_reset_from_start
    description: >
      Return a snapshot to the state it held at start_date, so the rebuild that follows is
      reproducible. Emits a delete of every version starting at or after start_date, then reopens
      the version whose successor was just deleted. The order matters: after the delete, at most
      one version per entity can still carry a valid_to at or after start_date, whereas reopening
      first would leave an entity with several open versions. Versions the source no longer produces
      are not recreated by the rebuild, so this is how a snapshot loses rows that should not exist.
    docs:
      show: true
    arguments:
      - name: target_name
        type: string
        description: The snapshot table to reset
      - name: start_date
        type: string
        description: Rebuild start date (yyyy-mm-dd); versions from this point forward are removed
      - name: valid_from_col_name
        type: string
        description: Column marking when a snapshot version became valid
      - name: valid_to_col_name
        type: string
        description: Column marking when a snapshot version stopped being valid
      - name: key_filter
        type: string
        description: Predicate from snapshot_key_filter, scoping both statements to named entities
